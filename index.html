<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Master OS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d9f48f'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' text-anchor='middle' fill='%23183228'%3EM%3C/text%3E%3C/svg%3E">
<title>Master OS</title>
<style>
  :root {
    --ink: #17231e; --muted: #5f6c65; --faint: #8a958f; --canvas: #f3f5f0; --paper: #fff; --line: #e2e7e1;
    --forest: #244f3f; --lime: #d9f48f; --danger: #a2432f; --warn: #8a5a17;
    --sage: #e5efe8; --sage-ink: #356549; --violet: #eee8f6; --violet-ink: #5c477e; --clay: #f5ebe4; --clay-ink: #83553c;
    --blue: #e5eef5; --blue-ink: #3e6888; --amber: #f7efdc; --amber-ink: #7d5c1d; --green: #e4f0e6; --green-ink: #2f6a49;
    --rose: #f6e6ea; --rose-ink: #8a4256; --teal: #e2f0ef; --teal-ink: #2f6764; --mba: #eceff3; --mba-ink: #4c5866;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  button { font: inherit; color: inherit; }
  h1, h2, .serif { font-family: Georgia, "Times New Roman", serif; font-weight: 500; letter-spacing: -.02em; }
  .hidden { display: none !important; }

  /* Lock screen */
  #lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  #lock form { width: 100%; max-width: 340px; display: grid; gap: 14px; }
  .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px; background: var(--lime); color: #183228; font: 28px Georgia, serif; }
  #lock h1 { margin: 6px 0 0; font-size: 30px; }
  #lock p { margin: 0; color: var(--muted); }
  #lock input[type=password] { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); font-size: 16px; }
  #lock label { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
  .primary { padding: 13px; border: 0; border-radius: 11px; background: var(--forest); color: #fff; font-weight: 650; }
  #lock-error { color: var(--danger); font-size: 14px; min-height: 20px; }

  /* App */
  main { padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(92px + var(--safe-bottom)); max-width: 680px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 30px; line-height: 1.1; }
  header p { margin: 6px 0 18px; color: var(--muted); font-size: 14px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
  .day { margin-bottom: 18px; }
  .day h2 { margin: 0 0 8px; font-size: 18px; display: flex; justify-content: space-between; align-items: baseline; }
  .day h2 small { font: 13px -apple-system, sans-serif; color: var(--faint); letter-spacing: 0; }
  .item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .chip { display: grid; place-items: center; height: 30px; border-radius: 8px; font-size: 11px; font-weight: 750; letter-spacing: .02em; }
  .item strong { display: block; font-size: 15px; font-weight: 620; }
  .item span.meta { display: block; color: var(--muted); font-size: 13px; }
  .time { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .time b { display: block; color: var(--ink); font-weight: 620; }
  .kind-deadline .chip { background: #fbe6e1; color: var(--danger); }
  .kind-reading .chip { background: var(--canvas); color: var(--muted); }
  .kind-holiday .chip { background: #fff3cf; color: var(--warn); }
  .empty { padding: 14px; color: var(--faint); font-size: 14px; }
  .more { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); font-weight: 600; }
  .group-label { margin: 18px 2px 8px; color: var(--muted); font-size: 13px; font-weight: 650; }
  .group-label.overdue { color: var(--danger); }
  .tick { width: 26px; height: 26px; border: 1.5px solid #c9d2cc; border-radius: 50%; background: var(--paper); display: grid; place-items: center; padding: 0; }
  .done .tick { background: var(--forest); border-color: var(--forest); color: #fff; }
  .done strong { text-decoration: line-through; color: var(--faint); }
  .item.with-tick { grid-template-columns: 26px 1fr auto; }
  .progress { color: var(--warn); font-weight: 650; }
  details summary { list-style: none; cursor: pointer; }
  details summary::-webkit-details-marker { display: none; }
  details p { margin: 8px 0 0; font-size: 14px; color: #34413b; }

  /* Month */
  .month-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .month-head h2 { margin: 0; font-size: 20px; }
  .month-head button { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
  .grid .wd { text-align: center; font-size: 11px; color: var(--faint); font-weight: 650; padding-bottom: 4px; }
  .cell { aspect-ratio: 1; border: 1px solid transparent; border-radius: 10px; background: var(--paper); display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: 6px 0 5px; font-size: 14px; }
  .cell.out { visibility: hidden; }
  .cell.today { border-color: var(--forest); font-weight: 750; }
  .cell.selected { background: var(--forest); color: #fff; }
  .cell.holiday { background: #fff8e2; }
  .cell.selected.holiday { background: var(--forest); }
  .dots { display: flex; gap: 2px; height: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--forest); }
  .dots i.d { background: var(--danger); }
  .dots i.r { background: #9aa59f; }
  .cell.selected .dots i { background: #fff; }

  /* Courses */
  .course { display: flex; gap: 12px; align-items: center; width: 100%; padding: 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
  .course:last-child { border-bottom: 0; }
  .course .chip { width: 44px; flex: 0 0 auto; }
  .back { border: 0; background: none; padding: 0 0 12px; color: var(--muted); font-weight: 600; }
  .sessions .item { grid-template-columns: 1fr auto; }
  .past { opacity: .55; }
  .next-tag { color: var(--forest); font-weight: 750; font-size: 12px; }

  /* Tab bar */
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 6px 6px calc(6px + var(--safe-bottom)); background: #182c25; }
  nav button { display: grid; justify-items: center; gap: 3px; padding: 7px 0; border: 0; border-radius: 10px; background: none; color: #b5c2bc; font-size: 11px; }
  nav button.active { background: #29453a; color: #fff; }
  nav svg { width: 20px; height: 20px; }
  footer { margin-top: 26px; color: var(--faint); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<section id="lock">
  <form id="lock-form" autocomplete="on">
    <div class="mark">M</div>
    <h1>Master OS</h1>
    <p>Enter your password to open your calendar.</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <label><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button class="primary" type="submit">Open</button>
    <div id="lock-error" role="alert"></div>
  </form>
</section>

<main id="app" class="hidden">
  <header><h1 id="today-title"></h1><p id="today-summary"></p></header>
  <section id="view"></section>
  <footer id="updated"></footer>
</main>

<nav id="tabs" class="hidden">

  <button data-tab="readings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Readings</button>

<script>
(() => {
  const TZ = "Europe/Madrid";
  const PASS_KEY = "mos-mobile-pass";
  const DONE_KEY = "mos-mobile-done";
  const box = JSON.parse(document.getElementById("payload").textContent);
  const b64 = (text) => Uint8Array.from(atob(text), (char) => char.charCodeAt(0));
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };

  async function decrypt(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(box.salt), iterations: box.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  async function unlock(password, remember) {
    const data = await decrypt(password);
    if (remember) store.set(PASS_KEY, password); else store.del(PASS_KEY);
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("tabs").classList.remove("hidden");
    start(data);
  }

  document.getElementById("lock-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = document.getElementById("lock-error");
    error.textContent = "";
    try { await unlock(document.getElementById("password").value, document.getElementById("remember").checked); }
    catch { error.textContent = "That password doesn't match."; }
  });
  const saved = store.get(PASS_KEY);
  if (saved) unlock(saved, true).catch(() => store.del(PASS_KEY));

  // ---------- helpers ----------
  const esc = (text) => String(text ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const dayKey = (date) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(date));
  const time = (date) => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }).format(new Date(date));
  const fmt = (date, options) => new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...options }).format(new Date(date));
  const keyToDate = (key) => new Date(`${key}T12:00:00Z`);
  const addDays = (key, days) => { const d = keyToDate(key); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().slice(0, 10); };
  const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
  const done = new Set(JSON.parse(store.get(DONE_KEY) ?? "[]"));
  const saveDone = () => store.set(DONE_KEY, JSON.stringify([...done]));

  let data, courseByCode, todayKey, events, state = { tab: "agenda", agendaDays: 14, month: null, selected: null, course: null };

  function start(payload) {
    data = payload;
    courseByCode = Object.fromEntries(data.courses.map((course) => [course.code, course]));
    todayKey = dayKey(new Date());
    state.month = todayKey.slice(0, 7);
    state.selected = todayKey;
    events = buildEvents();
    renderHeader();
    document.getElementById("updated").textContent = `Updated ${fmt(data.generatedAt, { month: "short", day: "numeric" })} at ${time(data.generatedAt)}`;
    document.querySelectorAll("nav button").forEach((button) => button.addEventListener("click", () => { state.tab = button.dataset.tab; state.course = null; render(); window.scrollTo(0, 0); }));
    render();
  }

  const chip = (code) => { const course = courseByCode[code]; const tone = course?.color ?? "mba"; return `<span class="chip" style="background:var(--${tone});color:var(--${tone}-ink)">${esc(code ?? "MBA")}</span>`; };
  const id = (item) => `${item.type}:${item.date}:${item.title}`;

  function buildEvents() {
    return [
      ...data.classes.map((c) => ({ type: "class", key: dayKey(c.date), sort: c.date, date: c.date, code: c.code, title: c.course, meta: `${c.session} · ${c.room}`, when: `${time(c.date)}–${c.end}` })),
      ...data.activities.map((a) => ({ type: "activity", key: dayKey(a.date), sort: a.date, date: a.date, title: a.title, meta: [a.detail, a.room].filter(Boolean).join(" · "), when: `${time(a.date)}–${a.end}` })),
      ...data.deadlines.map((d) => ({ type: "deadline", key: dayKey(d.date), sort: d.date, date: d.date, code: d.code, title: d.title, meta: `${d.course} · ${d.type}${d.leader ? ` · ${d.leader}` : ""}`, when: d.timeLabel === "Time not specified" ? "Due" : `Due ${time(d.date)}` })),
      ...data.readings.map((r) => ({ type: "reading", key: dayKey(r.due), sort: r.due, date: r.due, code: r.code, title: r.title, meta: `Read before ${r.code} · Session ${r.session} · ${r.minutes} min`, when: "" })),
      ...data.holidays.map((h) => ({ type: "holiday", key: h.date, sort: `${h.date}T00:00`, date: h.date, title: h.title, meta: h.kind, when: "All day" })),
    ].sort((a, b) => a.sort.localeCompare(b.sort));
  }

  function renderHeader() {
    document.getElementById("today-title").textContent = fmt(new Date(), { weekday: "long", month: "long", day: "numeric" });
    const now = Date.now();
    const classesToday = data.classes.filter((c) => dayKey(c.date) === todayKey && new Date(c.date).getTime() > now - 3600000).length;
    const week = addDays(todayKey, 7);
    const open = data.deadlines.filter((d) => !done.has(id({ type: "deadline", ...d })));
    const overdue = open.filter((d) => dayKey(d.date) < todayKey).length;
    const soon = open.filter((d) => dayKey(d.date) >= todayKey && dayKey(d.date) <= week).length;
    document.getElementById("today-summary").textContent = [
      classesToday ? `${plural(classesToday, "class", "classes")} today` : "No classes today",
      overdue ? `${overdue} overdue` : null,
      `${plural(soon, "deadline")} this week`,
    ].filter(Boolean).join(" · ");
  }

  function itemHtml(event, withTick = false) {
    const kindChip = event.type === "deadline" ? `<span class="chip">DUE</span>` : event.type === "reading" ? `<span class="chip">READ</span>` : event.type === "holiday" ? `<span class="chip">OFF</span>` : chip(event.code);
    const isDone = done.has(id(event));
    const lead = withTick ? `<button class="tick" data-done="${esc(id(event))}" aria-label="Mark done">${isDone ? "✓" : ""}</button>` : kindChip;
    return `<div class="item kind-${event.type} ${withTick ? "with-tick" : ""} ${isDone ? "done" : ""}">${lead}<div><strong>${esc(event.title)}</strong><span class="meta">${esc(event.meta)}</span></div><div class="time">${esc(event.when)}</div></div>`;
  }

  const dayTitle = (key) => key === todayKey ? "Today" : key === addDays(todayKey, 1) ? "Tomorrow" : fmt(keyToDate(key), { weekday: "long", month: "short", day: "numeric", timeZone: "UTC" });

  function agenda() {
    const last = addDays(todayKey, state.agendaDays);
    const days = [];
    for (let key = todayKey; key <= last; key = addDays(key, 1)) {
      const items = events.filter((event) => event.key === key);
      if (items.length || key === todayKey) days.push({ key, items });
    }
    const more = events.some((event) => event.key > last);
    return days.map(({ key, items }) => `<div class="day"><h2>${esc(dayTitle(key))}<small>${key === todayKey || key === addDays(todayKey, 1) ? esc(fmt(keyToDate(key), { month: "short", day: "numeric", timeZone: "UTC" })) : ""}</small></h2><div class="card">${items.length ? items.map((e) => itemHtml(e)).join("") : `<div class="empty">Nothing scheduled.</div>`}</div></div>`).join("")
      + (more ? `<button class="more" data-more>Show two more weeks</button>` : "");
  }

  function month() {
    const [year, mon] = state.month.split("-").map(Number);
    const first = new Date(Date.UTC(year, mon - 1, 1));
    const offset = (first.getUTCDay() + 6) % 7;
    const days = new Date(Date.UTC(year, mon, 0)).getUTCDate();
    const cells = Array.from({ length: Math.ceil((offset + days) / 7) * 7 }, (_, i) => {
      const day = i - offset + 1;
      if (day < 1 || day > days) return `<div class="cell out"></div>`;
      const key = `${state.month}-${String(day).padStart(2, "0")}`;
      const items = events.filter((e) => e.key === key);
      const dots = items.filter((e) => e.type !== "holiday").slice(0, 4).map((e) => `<i class="${e.type === "deadline" ? "d" : e.type === "reading" ? "r" : ""}"></i>`).join("");
      const classes = ["cell", key === todayKey && "today", key === state.selected && "selected", items.some((e) => e.type === "holiday") && "holiday"].filter(Boolean).join(" ");
      return `<button class="${classes}" data-day="${key}">${day}<span class="dots">${dots}</span></button>`;
    }).join("");
    const selectedItems = events.filter((e) => e.key === state.selected);
    return `<div class="month-head"><button data-month="-1" aria-label="Previous month">‹</button><h2>${esc(fmt(new Date(Date.UTC(year, mon - 1, 15)), { month: "long", year: "numeric", timeZone: "UTC" }))}</h2><button data-month="1" aria-label="Next month">›</button></div>
      <div class="grid">${["M", "T", "W", "T", "F", "S", "S"].map((d) => `<div class="wd">${d}</div>`).join("")}${cells}</div>
      <div class="day"><h2>${esc(dayTitle(state.selected))}</h2><div class="card">${selectedItems.length ? selectedItems.map((e) => itemHtml(e)).join("") : `<div class="empty">Nothing scheduled.</div>`}</div></div>`;
  }

  function deadlines() {
    const week = addDays(todayKey, 7);
    const items = events.filter((e) => e.type === "deadline");
    const groups = [
      ["Overdue", items.filter((e) => e.key < todayKey && !done.has(id(e))), "overdue"],
      ["Today", items.filter((e) => e.key === todayKey)],
      ["Next 7 days", items.filter((e) => e.key > todayKey && e.key <= week)],
      ["Later", items.filter((e) => e.key > week)],
      ["Done on this phone", items.filter((e) => e.key < todayKey && done.has(id(e)))],
    ].filter(([, list]) => list.length);
    return groups.map(([label, list, cls]) => `<div class="group-label ${cls ?? ""}">${label} · ${list.length}</div><div class="card">${list.map((e) => {
      const source = data.deadlines.find((d) => d.date === e.date && d.title === e.title);
      const when = `${fmt(e.date, { month: "short", day: "numeric" })}${source?.timeLabel === "Time not specified" ? "" : ` · ${time(e.date)}`}`;
      return itemHtml({ ...e, when, meta: `${e.meta}${source?.status === "in-progress" ? " · In progress" : ""}` }, true);
    }).join("")}</div>`).join("") || `<div class="empty">No open deadlines.</div>`;
  }

  function readings() {
    const upcoming = events.filter((e) => e.type === "reading" && e.key >= todayKey);
    if (!upcoming.length) return `<div class="empty">No upcoming readings.</div>`;
    const byDay = upcoming.reduce((map, e) => map.set(e.key, [...(map.get(e.key) ?? []), e]), new Map());
    return [...byDay].map(([key, list]) => `<div class="day"><h2>${esc(dayTitle(key))}<small>${plural(list.reduce((t, e) => t + (data.readings.find((r) => r.title === e.title)?.minutes ?? 0), 0), "min")}</small></h2><div class="card">${list.map((e) => {
      const reading = data.readings.find((r) => r.title === e.title && r.due === e.date);
      const body = itemHtml({ ...e, when: `${reading?.minutes ?? ""} min` }, true);
      return reading?.summary ? `<details>${body.replace('<div class="item', '<summary class="item').replace(/<\/div>$/, "</summary>")}<p style="padding:0 14px 12px">${esc(reading.summary)}</p></details>` : body;
    }).join("")}</div></div>`).join("");
  }

  function courses() {
    if (state.course) return courseDetail(courseByCode[state.course]);
    const nextClass = (code) => data.classes.find((c) => c.code === code && new Date(c.date).getTime() > Date.now());
    return `<div class="card">${data.courses.map((course) => {
      const next = nextClass(course.code);
      return `<button class="course" data-course="${esc(course.code)}">${chip(course.code)}<div><strong>${esc(course.name)}</strong><span class="meta" style="display:block;color:var(--muted);font-size:13px">${next ? `Next: ${esc(fmt(next.date, { weekday: "short", month: "short", day: "numeric" }))} · ${time(next.date)}` : "No upcoming classes"}</span></div></button>`;
    }).join("")}</div>`;
  }

  function courseDetail(course) {
    const now = Date.now();
    const nextIndex = course.sessions.findIndex((s) => new Date(s.date).getTime() > now - 3600000);
    return `<button class="back" data-course="">‹ Courses</button><h2 class="serif" style="margin:0 0 4px;font-size:26px">${esc(course.name)}</h2><p style="margin:0 0 16px;color:var(--muted)">${esc(course.professor)}</p>
      <div class="group-label">Sessions</div><div class="card sessions">${course.sessions.map((s, i) => `<div class="item ${i < nextIndex || nextIndex === -1 ? "past" : ""}"><div><strong>${esc(s.title ? `${s.label} · ${s.title}` : s.label)}</strong><span class="meta">${esc(fmt(s.date, { weekday: "short", month: "short", day: "numeric" }))} · ${time(s.date)}–${esc(s.end)} · ${esc(s.room)}</span>${i === nextIndex ? `<span class="next-tag">Next class</span>` : ""}</div><div></div></div>`).join("") || `<div class="empty">No classes in the calendar.</div>`}</div>
      ${course.assessment.length ? `<div class="group-label">Assessment</div><div class="card">${course.assessment.map((a) => `<div class="item" style="grid-template-columns:52px 1fr"><strong class="serif" style="font-size:18px">${esc(a.weight)}</strong><div><strong>${esc(a.title)}</strong><span class="meta">${esc(a.detail ?? "")}</span></div></div>`).join("")}</div>` : ""}`;
  }

  function render() {
    document.querySelectorAll("nav button").forEach((button) => button.classList.toggle("active", button.dataset.tab === state.tab));
    const view = { agenda, month, deadlines, readings, courses }[state.tab]();
    document.getElementById("view").innerHTML = view;
  }

  document.getElementById("view").addEventListener("click", (event) => {
    const target = event.target.closest("button");
    if (!target) return;
    if (target.dataset.more !== undefined) { state.agendaDays += 14; render(); }
    else if (target.dataset.month) {
      const [y, m] = state.month.split("-").map(Number);
      const next = new Date(Date.UTC(y, m - 1 + Number(target.dataset.month), 1));
      state.month = next.toISOString().slice(0, 7);
      render();
    }
    else if (target.dataset.day) { state.selected = target.dataset.day; render(); }
    else if (target.dataset.done) {
      event.preventDefault();
      const key = target.dataset.done;
      done.has(key) ? done.delete(key) : done.add(key);
      saveDone(); renderHeader(); render();
    }
    else if (target.dataset.course !== undefined) { state.course = target.dataset.course || null; render(); window.scrollTo(0, 0); }
  });

  // Keep "today" right when the app stays open overnight.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && data && dayKey(new Date()) !== todayKey) { todayKey = dayKey(new Date()); renderHeader(); render(); }
  });
})();
</script>
</body>
</html>
